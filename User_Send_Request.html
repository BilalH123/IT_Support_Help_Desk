<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk - Submit a Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa; /* Light gray background */
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #007bff; /* Bootstrap's primary color */
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 30px 15px;
            z-index: 1000;
        }

        /* Sidebar heading and links */
        .sidebar h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
            color: #ffffff;
        }
        .sidebar a {
            color: #e9ecef;
            font-weight: 500;
            text-decoration: none;
            display: block;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            transition: background-color 0.3s ease;
        }
        .sidebar a:hover {
            background-color: #0056b3;
            color: #ffffff;
        }

        /* Main content area */
        .main-content {
            margin-left: 270px;
            padding: 40px 20px;
        }
        .headers {
            text-align: center;
            color: #343a40;
            font-weight: 600;
        }

        /* Form container styling */
        .form-container {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 0.5rem;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>IT Helpdesk</h2>
        <a href="User_Requests.php">View Your Requests</a>
        <a href="User_Send_Request.html">Send a Request</a>
        <a href="User_Responses.php">Response</a>
    </div>

    <!-- Main content area --> 
    <div class="main-content">
        <h1 class="text-center">Form Submission</h1>
        <div class="container form-container mt-4">
            <p class="text-center mb-4">Submit your request for any issues you are facing. Our IT specialist will receive the ticket and assist you promptly.</p>
            <h2 class="text-center mb-4">Submit Your Ticket</h2>
            <form method="post" action="Submission_Form.php">
                <div class="mb-3">
                    <label for="firstname" class="form-label">First Name:</label>
                    <input type="text" class="form-control" id="firstname" name="firstname" required>
                </div>
                
                <div class="mb-3">
                    <label for="lastname" class="form-label">Last Name:</label>
                    <input type="text" class="form-control" id="lastname" name="lastname" required>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                
                <div class="mb-3">
                    <label for="description" class="form-label">Issue Description:</label>
                    <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                </div>
                
                <div class="mb-4">
                    <label for="priority" class="form-label">Priority Level:</label>
                    <select class="form-select" id="priority" name="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Submit Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
